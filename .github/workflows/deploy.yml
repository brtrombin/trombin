# Publica o site no GitHub Pages: gera _site/ com o Eleventy e faz o deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]      # todo push na main publica (inclusive o do sync do Substack)
  workflow_dispatch:      # permite rodar manualmente pelo GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

# se dois deploys coincidirem, o mais antigo é cancelado
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) gera o site e guarda _site/ como artefato
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 2) publica o artefato no GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
