# Importa posts novos do Substack: roda scripts/sync-substack.py e, se algo
# mudou em articles/ ou img/, faz commit e push (o que dispara o deploy).
#
# Agendamento diário pausado: o Substack responde HTTP 403 (desafio anti-bot
# da Cloudflare) aos servidores do GitHub, então a execução falha aqui.
# O script funciona rodando localmente: python scripts/sync-substack.py
# Para reativar, devolver ao bloco "on":
#   schedule:
#     - cron: "0 7 * * *"   # diariamente às 07:00 UTC (04:00 BRT)
name: Sync Substack

on:
  workflow_dispatch:        # só manual, pelo GitHub UI

permissions:
  contents: write           # necessário para o push do commit automático

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements-sync.txt

      - name: Rodar sync
        run: python scripts/sync-substack.py

      - name: Commit e push se houver novidades
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/ img/
          if git diff --staged --quiet; then
            echo "Nenhum post novo encontrado."
          else
            git commit -m "sync: importa novos textos do Substack"
            git push
          fi
